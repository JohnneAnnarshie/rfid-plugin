allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
    project.evaluationDependsOn(":DeviceList")
    project.evaluationDependsOn(":rfidreaderplugin:Rfid.AsciiProtocol-Library")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
